<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>AutoDesign — Redirecting to Workspace</title>
  <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%232563EB'/%3E%3Cpath d='M9 11h14v3H9zm0 5h10v3H9zm0 5h14v3H9z' fill='%23FFFFFF'/%3E%3C/svg%3E" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --color-bg: #F7F8FA;
      --color-surface: #FFFFFF;
      --color-text-main: #171A23;
      --color-text-secondary: #687386;
      --color-primary: #2563EB;
      --color-primary-hover: #1D4ED8;
      --color-border: #E5E7EB;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      background-color: var(--color-bg);
      color: var(--color-text-main);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: var(--color-surface);
      border: 1px solid var(--color-border);
      border-radius: 12px;
      max-width: 460px;
      width: 100%;
      padding: 32px;
      box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      text-align: center;
    }
    .badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 48px;
      height: 48px;
      border-radius: 10px;
      background: #EFF6FF;
      color: var(--color-primary);
      font-weight: 700;
      font-size: 18px;
      margin-bottom: 16px;
    }
    h1 {
      font-size: 20px;
      font-weight: 700;
      margin-bottom: 8px;
      letter-spacing: -0.01em;
    }
    p {
      font-size: 14px;
      line-height: 1.6;
      color: var(--color-text-secondary);
      margin-bottom: 24px;
    }
    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      background: var(--color-primary);
      color: #FFFFFF;
      text-decoration: none;
      font-weight: 600;
      font-size: 14px;
      padding: 10px 20px;
      border-radius: 8px;
      transition: background-color 0.15s ease;
    }
    .btn:hover {
      background: var(--color-primary-hover);
    }
  </style>
  <script>
    (function () {
      var knownRoutes = [
        'dashboard',
        'projects',
        'design-studio',
        'asset-library',
        'brand-kit',
        'templates',
        'export',
        'validation',
        'settings'
      ];
      var pathParts = window.location.pathname.replace(/\/+$/, '').split('/');
      var lastSegment = (pathParts[pathParts.length - 1] || '').toLowerCase();
      if (knownRoutes.indexOf(lastSegment) !== -1) {
        var basePath = pathParts.slice(0, -1).join('/') + '/';
        window.location.replace(basePath + '#' + lastSegment);
      }
    })();
  </script>
</head>
<body>
  <main class="card">
    <div class="badge" aria-hidden="true">AD</div>
    <h1>Page Not Found in Workspace</h1>
    <p>
      AutoDesign uses client-side hash routing for GitHub Pages compatibility. Return to the main workspace dashboard below.
    </p>
    <a id="return-home-link" href="./#dashboard" class="btn">Return to AutoDesign Dashboard</a>
  </main>
</body>
</html>
